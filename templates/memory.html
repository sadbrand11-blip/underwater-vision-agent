<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长期记忆 · 水下图像分析</title><link rel="stylesheet" href="/static/conversation.css"></head>
<body><main><header><p class="eyebrow">本地长期记忆 · 0.5.1</p><h1>记住偏好，查看以前的分析</h1><p>摘要在重启后保留。历史只能辅助规划，不能代替新图片的实际分析。</p><a href="/agent">返回对话工作台</a> · <a href="/knowledge">知识检索对照</a></header>
<div class="workspace"><aside class="card"><h2>使用偏好</h2><form id="preferences-form"><label><input id="memory-enabled" type="checkbox"> 启用长期记忆与自动保存</label><p class="small">关闭后不读取偏好、不参考历史、不保存新分析；已有摘要仍可查看或删除。</p>
<label for="default-targets">默认关注类别</label><select id="default-targets" multiple size="7"><option value="propeller">螺旋桨</option><option value="pipe">管道</option><option value="pipe_type2">第二类管道</option><option value="red_fin">红色鳍片</option><option value="net">渔网</option><option value="qr_codes">二维码</option><option value="underwater_robot">水下机器人（实验模型）</option></select><p class="small">可按住 Ctrl 多选。只关心管道时请选择两类管道；不选则默认全部支持类别。明确指定目标或“全部类别”优先，曝光单任务不会增加检测。</p>
<label for="display-detail">结果显示</label><select id="display-detail"><option value="compact">简洁：图片与过程默认折叠</option><option value="expanded">展开：直接查看图片与过程</option></select><button id="save-preferences" type="submit">保存偏好</button></form><p id="preference-status" role="status"></p><p class="small">按任务开始时的设置执行；修改后从下一轮生效。偏好不会从聊天中自动推断。</p></aside>
<section class="card"><h2>分析历史</h2><form id="history-search"><label for="history-query">搜索摘要</label><input id="history-query" type="search" maxlength="400" placeholder="例如：管道、质量失败、校正"><button type="submit">搜索 / 刷新</button></form><button id="clear-history" class="secondary">清空分析历史</button><p id="history-status" role="status"></p><div id="history-list"></div><p class="small">最近200条不同摘要。不会保存原图、完整对话或密钥；无法从摘要恢复过期图片会话。</p></section></div></main><script src="/static/memory.js"></script></body></html>
